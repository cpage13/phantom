name: per-PR

# Per-PR CI battery. Jobs are independent and run in parallel; no `needs:`.
# Each job checks out, sets up Python 3.14 + uv, then runs ONE combined step:
#
#   uv sync --all-packages   # the workspace root is `package = false`, so a
#                            # plain `uv sync` installs NONE of the member
#                            # packages (and would prune them); --all-packages
#                            # installs phantom / phantom-client / phantom-emulator
#   export UV_NO_SYNC=1      # so the following `uv run` does not re-sync and
#                            # prune those members
#   <command>
#
# Tiers mirror the per-push battery: static (lint / format / types /
# pre-commit / falsifiability), unit (+ emulator smoke), integration,
# contract, e2e-core (functional), and e2e-load (the load tier). Stress runs
# nightly (nightly_stress.yml); perf runs manually (perf.yml).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs when a PR is updated.
concurrency:
  group: per-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run ruff check src/ tests/

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run ruff format --check src/ tests/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      # Per-package mypy invocation; a workspace-level mypy collides on the
      # dual module names.
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          bash scripts/precommit/run_mypy_per_package.sh

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pre-commit run --all-files

  unit-phantom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          cd src/phantom-service && uv run pytest tests/unit/ -q

  unit-phantom-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          cd src/phantom-client && uv run pytest tests/unit/ -q

  # Declared-floor lane for the PyPI-publishable SDK (finding S13-9).
  # phantom-client declares requires-python = ">=3.12", but every other lane
  # runs 3.14 and the workspace uv.lock is pinned >=3.14, because the root and
  # the two service-side members force that intersection. So the declared floor
  # was never RESOLVED and never EXECUTED, and a 3.13-only typing import could
  # ship to PyPI and fail on a consumer's 3.12 interpreter with every lane
  # green. CONTEXT.md:157 states the rule; this lane is what enforces it.
  #
  # Deliberately NOT `uv sync --all-packages`: that resolves the WORKSPACE
  # lock, which cannot go below 3.14, so it would either fail or quietly hand
  # this lane a 3.14 interpreter. The client is installed on its own, from its
  # own pyproject.toml, against public PyPI — the same `uv pip install
  # --python` pattern unit-phantom-old-sqlite uses to escape the workspace venv.
  # phantom-client depends only on httpx and pydantic, no workspace member.
  #
  # check_client_python_floor.py hard-asserts that the interpreter IS the
  # floor the package declares (not merely >= it) before importing every
  # module in the package, so a workflow edit cannot silently degrade this
  # lane to a 3.14 false-green, and a 3.13-only import in a module no unit
  # test touches is still caught.
  unit-phantom-client-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Resolve phantom-client on its declared floor
        run: |
          set -euo pipefail
          PYBIN="$(which python)"
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          uv pip install --python "$PYBIN" pytest pytest-asyncio -e src/phantom-client
      - name: Assert the floor interpreter and import every module
        run: |
          set -euo pipefail
          "$PYBIN" scripts/check_client_python_floor.py
      - name: Run the client unit suite on the floor interpreter
        run: |
          set -euo pipefail
          cd src/phantom-client
          "$PYBIN" -m pytest tests/unit/ -q

  unit-phantom-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          cd src/phantom-emulator && uv run pytest tests/unit/ -q

  smoke-phantom-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          cd src/phantom-emulator && uv run pytest tests/smoke/ -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pytest tests/integration/ -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pytest tests/contract/ -q

  # E2E core: the functional e2e battery (fast feedback). Excludes the
  # load / perf / stress tiers (own lanes / nightly) and the docker tier
  # (its own e2e-docker job below).
  e2e-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pytest tests/e2e/ -q -m "not load and not perf and not stress and not docker"

  # E2E docker tier (audit T7): builds both images from the repo
  # Dockerfiles and drives the compose named-volume replacement matrix.
  # Separate from e2e-core so image builds never slow the core battery.
  #
  # THIS LANE USED TO EXIT 0 WITH EVERYTHING SKIPPED. The docker-tier module
  # carries a module-level `skipif(not _daemon_reachable(...))`, so an
  # unreachable daemon turned the whole tier into skips and pytest returned 0:
  # a green badge on a lane that ran nothing. Two steps close that, a
  # precondition and a post-condition, because the precondition alone would
  # stop covering the lane the day a second skip reason is added.
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      # PRECONDITION: the daemon must be reachable. Failing here names the
      # real cause instead of letting the tier evaporate into skips.
      - name: Assert the Docker daemon is reachable
        run: |
          set -euo pipefail
          docker info > /dev/null
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pytest tests/e2e/ -q -m docker --junit-xml=docker-tier.xml
      # POST-CONDITION: the tier must have actually executed. Any skip, any
      # error, or an empty run fails the lane, whatever the reason.
      - name: Assert the docker tier actually ran
        if: always()
        run: |
          set -euo pipefail
          uv run python - docker-tier.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          if not report.is_file():
              raise SystemExit(f"{report}: no junit report; the docker tier did not run")
          root = ET.parse(report).getroot()
          suites = root.iter("testsuite")
          total = skipped = errors = failures = 0
          for suite in suites:
              total += int(suite.get("tests", "0"))
              skipped += int(suite.get("skipped", "0"))
              errors += int(suite.get("errors", "0"))
              failures += int(suite.get("failures", "0"))
          executed = total - skipped - errors
          print(f"docker tier: {total} collected, {skipped} skipped, {errors} errors, {failures} failures")
          if total == 0:
              raise SystemExit("the docker tier collected NO tests; this lane proves nothing")
          if skipped or errors:
              raise SystemExit(
                  f"the docker tier did not fully run ({skipped} skipped, {errors} errors); "
                  "a green badge on a lane that ran nothing is worse than no lane"
              )
          print(f"docker tier executed {executed} test(s)")
          PY

  # E2E load tier (the `load`-marked files: test_e2e_23_sustained_15min.py and
  # test_e2e_24_sigkill_idempotency.py; ~15 min via test_e2e_23). The tier is
  # selected by the MARKER, not by a filename glob; the old
  # `test_e2e_2[1234]_*` shorthand named two files, 21 and 22, that do not
  # exist. Isolated so it does not slow e2e-core; runs on every push, as before.
  e2e-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run pytest tests/e2e/ -q -m load

  falsifiability-post-send-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_post_send_size.py

  falsifiability-descriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_descriptions.py

  # Static-shape gate for the json_each prerequisite (§0.1 / TASK 0.1b,
  # acceptance criterion 3). Asserts all THREE JSON-path lookups
  # (list_by_key_value, find_by_captured_value, find_by_local_uuid) key on the
  # bound-parameter json_each form and that no quoted-JSON-path label builder
  # exists in the storage module, so a revert toward the version-skew bug fails
  # on EVERY runner; ADDITIONAL to, never a substitute for, the behavioral
  # unit-phantom-old-sqlite gate (which is blind on a modern 3.50.4 runner).
  #
  # Runs --selftest FIRST, for the same reason falsifiability-await-in-lock
  # does: the previous version of this gate was scoped to one method and keyed
  # on one helper's NAME, so a rename disarmed it silently and nothing in CI
  # had ever watched it reject anything (finding S13-4).
  falsifiability-kv-json-each:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_kv_query_uses_json_each.py --selftest
          uv run python scripts/check_kv_query_uses_json_each.py

  # Await-inside-a-state-lock gate. Runs --selftest FIRST, because the shell
  # hook this replaced was inert for its entire life and nobody had ever
  # watched it reject anything; a gate with no executed proof of rejection is
  # indistinguishable from one that cannot fail.
  falsifiability-await-in-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_await_in_lock.py --selftest
          uv run python scripts/check_await_in_lock.py

  # Atomic-admission contract: the upload row INSERT + idempotency_index
  # INSERT must wrap in ONE SQLite transaction. Complements the runtime test
  # at tests/e2e/crash_recovery/test_crash_admission_atomic.py.
  falsifiability-atomic-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_atomic_admission.py

  # Contract-drift gate: contracts/ is generated FROM the Python wire/admin/
  # config models by scripts/export_contracts.py (the Go implementation's
  # language-neutral source of truth). --check regenerates into a temp dir
  # and byte-compares against the committed contracts/ tree, so a model
  # change without a matching regeneration fails here instead of silently
  # drifting.
  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/export_contracts.py --check

  # Consumer-side contracts gate (finding S13-2). contracts-drift above is
  # CIRCULAR on its own: it compares the generator's output to the generator's
  # own committed output, and the fixtures round-trip through the same pydantic
  # model that emitted them. This lane reads contracts/ the way a Go port does,
  # through a third-party JSON Schema implementation with no pydantic and no
  # phantom in the process: every schema must compile, and every committed
  # fixture must validate against its committed schema. --selftest runs first
  # and proves the committed schemas reject a nonconforming document.
  contracts-consumer-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync --all-packages
          export UV_NO_SYNC=1
          uv run python scripts/check_contract_schemas.py --selftest
          uv run python scripts/check_contract_schemas.py

  # Old-SQLite gate (the json_each prerequisite, §1.4a / TASK 0.1). The per-PR
  # unit lane runs uv-managed CPython 3.14 => SQLite 3.50.4, which MASKS the
  # quote-bearing-key bug. This job builds an OLD libsqlite3 (3.43.2) from
  # source and LD_PRELOADs it under setup-python's DYNAMICALLY-linked _sqlite3,
  # then runs ONLY the special-char KVS tests on it. It HARD-ASSERTS the loaded
  # version is < 3.50 so it can never silently degrade to a 3.50.4 false-green.
  unit-phantom-old-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      # Build old SQLite 3.43.2 -> .libs/libsqlite3.so from the year-stamped
      # autoconf release archive (3430200 = 3.43.2, a known-BREAKING build for
      # the quoted-json-path bug). The fossil hash-tarball URL this job first
      # pinned (src/tarball/539f74919d5d8cef) now returns 404, so the pin
      # moved to the stable release-archive scheme. The "Assert OLD SQLite"
      # step below still hard-fails if the loaded build is not < 3.50.
      - name: Build old libsqlite3 (3.43.2)
        run: |
          set -euo pipefail
          cd /tmp
          wget -q https://www.sqlite.org/2023/sqlite-autoconf-3430200.tar.gz
          tar -xzf sqlite-autoconf-3430200.tar.gz
          cd sqlite-autoconf-3430200
          CPPFLAGS="-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1" ./configure
          make -j"$(nproc)"
          echo "OLD_SQLITE_SO=/tmp/sqlite-autoconf-3430200/.libs/libsqlite3.so" >> "$GITHUB_ENV"
      # CRITICAL: the run interpreter must be setup-python's (its _sqlite3 is
      # DYNAMICALLY linked, so LD_PRELOAD takes effect). Do NOT use `uv sync`'s
      # .venv; that venv is built on uv's standalone Python whose _sqlite3 is
      # STATIC and would IGNORE LD_PRELOAD (the precondition below would then
      # fail loud; safe, but the gate would never actually run). Install deps
      # INTO the setup-python interpreter with `uv pip install --python`.
      - name: Install deps into the dynamically-linked interpreter
        run: |
          set -euo pipefail
          PYBIN="$(which python)"          # setup-python's python, on PATH, dynamic _sqlite3
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          # Editable-install the three workspace members + pytest into THIS python.
          uv pip install --python "$PYBIN" pytest pytest-asyncio \
            -e src/phantom-service -e src/phantom-client -e src/phantom-emulator
      # HARD PRECONDITION: fail LOUDLY unless the preloaded SQLite is < 3.50.
      # This is the gate's teeth; it stops a future masking-build bump (or a
      # static-_sqlite3 interpreter that silently ignores LD_PRELOAD) from
      # degrading this job to a 3.50.4 false-green.
      - name: Assert OLD SQLite is loaded (< 3.50)
        run: |
          set -euo pipefail
          LD_PRELOAD="$OLD_SQLITE_SO" "$PYBIN" - <<'PY'
          import sqlite3
          v = sqlite3.sqlite_version
          print(f"loaded sqlite_version = {v}")
          parts = tuple(int(x) for x in v.split("."))
          assert parts < (3, 50), (
              f"PRECONDITION FAILED: sqlite_version {v} is >= 3.50; the old-SQLite "
              f"gate degraded to a MASKING build and would false-green. LD_PRELOAD did "
              f"not take effect (statically-linked _sqlite3?). Failing loudly."
          )
          PY
      # Run ONLY the special-char KVS tests on the OLD SQLite. These are the
      # tests that go false-green on 3.50.4; here they actually exercise json_each.
      # ONE pytest invocation over BOTH files with a SINGLE -k OR-expression.
      # (pytest applies a single -k across the whole collection; two -k flags
      # would mean only the LAST applies, and -k odd matches ZERO node-ids; the
      # string "odd" lives only in the admin test's BODY, never a node-id, so the
      # real test is `test_dot_and_quote_bearing_kvs_keys_are_addressable`, which
      # the `quote_bearing` term selects. Executed-and-verified: this collects 5
      # node-ids (the four `special_character` params incl. q"uote, plus the one
      # `quote_bearing` admin test) and exits 0 when the json_each fix is present.)
      - name: Run special-char KVS tests on OLD SQLite
        run: |
          set -euo pipefail
          cd src/phantom-service
          LD_PRELOAD="$OLD_SQLITE_SO" "$PYBIN" -m pytest -q \
            tests/unit/test_sqlite_store.py tests/unit/test_admin_group_and_lookups.py \
            -k "special_character or quote_bearing"
