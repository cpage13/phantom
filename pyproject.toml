# Workspace root for Phantom.
# This file declares the uv workspace and the shared tooling config (ruff,
# mypy, pytest). Per-package pyproject.toml files live under
# src/<package>/pyproject.toml and contain their own dependencies and build
# config.

[project]
name = "phantom-workspace"
version = "0.0.0"
description = "Workspace root for Phantom and its companion packages"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv]
package = false  # workspace root is a coordinator, not itself a buildable package

[tool.uv.workspace]
members = [
  "src/phantom-service",
  "src/phantom-client",
  "src/phantom-emulator",
]
# NB: src/phantom-deploy is intentionally NOT a workspace member — per
# ADR-020 (Phase 6) it ships the container image + reference compose
# only, not a Python package. The directory carries Dockerfile +
# docker-compose.yml + README.md.

# Internal workspace deps — declare a package name in any member's dependencies
# and uv will resolve it from the workspace instead of PyPI. Keys are
# DISTRIBUTION names, so they must match each member's [project] name.
# `phantom` was listed here and is not a distribution in this workspace: the
# service's [project] name is `phantom-service` (`phantom` is its import
# package and its console script). A source entry for a name no member
# publishes binds nothing.
[tool.uv.sources]
phantom-service = { workspace = true }
phantom-client = { workspace = true }
phantom-emulator = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "ruff>=0.7",
  "mypy>=1.13",
  "hatchling>=1.25",
  "pre-commit>=3.7",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
]

# ---------------------------------------------------------------------------
# Shared tooling config (applies to every package in the workspace)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "A",    # builtins shadowing
  "C4",   # comprehensions
  "T20",  # no print()
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Falsifiability-tooling scripts under scripts/ legitimately use print()
# for CLI output and need to swallow arbitrary module-import exceptions.
"scripts/**/*.py" = ["T201", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
# NOTE ON SCOPE. This block is read only by a mypy invocation made FROM THE
# REPOSITORY ROOT. Both enforcing paths (the `types` CI job and the
# `mypy-strict` pre-commit hook) run scripts/precommit/run_mypy_per_package.sh,
# which cds into each package directory and runs `mypy --strict -p <module>`
# there; mypy reads config from the invocation directory and does not walk up,
# and no package carries a [tool.mypy] of its own, so those runs get their
# strictness from the --strict FLAG, not from here.
#
# A `files = ["src/*/src"]` key used to sit here. It was dead twice over: the
# per-package runs never read this file, and a root-level run always names its
# targets on the command line, which overrides `files` anyway.
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "src/phantom-service/tests",
  "src/phantom-client/tests",
  "src/phantom-emulator/tests",
  # phantom-deploy carries no Python tests post-Phase-6 (ADR-020).
  "tests",
]
# Only the repo root is on sys.path, so the e2e suite's `from tests.e2e...`
# imports resolve against the repo-root tests/ package.
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
# Load tests are the files carrying the `load` marker: today
# tests/e2e/test_e2e_23_sustained_15min.py and
# tests/e2e/test_e2e_24_sigkill_idempotency.py. (The old
# `test_e2e_2[1234]_*` shorthand named two files, 21 and 22, that do not
# exist.) The marker, not a filename glob, is what selects the tier. They
# take minutes (test_e2e_23 alone runs 15 minutes wall-clock) so the
# default suite filters them out. Explicit `pytest -m load tests/e2e/`
# runs them.
#
# `perf` tests assert the tight synthetic-return budget
# (SYNTHETIC_RETURN_BUDGET_SECONDS, 0.1-0.25s) on the buffering POST.
# On a loaded host or a slow Pi those assertions fire as FALSE failures
# even though the functional behavior is correct, so they are excluded
# from the default suite and run on a quiet/dedicated lane via
# `uv run pytest -m perf tests/e2e/`. Nothing is deleted — the tagged
# tests still run, just on the perf lane.
addopts = "-m 'not load and not perf and not stress'"
markers = [
  "e2e: end-to-end test exercising the full package stack (tests/e2e/)",
  "load: long-running load test gated out of the default suite (tests/e2e/test_e2e_23_sustained_15min.py, tests/e2e/test_e2e_24_sigkill_idempotency.py); run via `pytest -m load`",
  "stress: stress test run on the nightly CI cron only; run via `pytest -m stress` (plan § 1.1.10)",
  "perf: performance-budget assertions (SYNTHETIC_RETURN_BUDGET_SECONDS); run on a quiet/dedicated lane via `-m perf`; excluded from the default suite because a loaded host produces false failures",
  "docker: compose-topology E2E requiring a Docker daemon (tests/e2e/test_docker_volume_replacement.py); runs in the dedicated e2e-docker CI job, excluded from e2e-core",
  "conformance: implementation-blind black-box e2e (every assertion observable over config + HTTP/UDS + filesystem artifacts + the emulator; no Python-internal log-format or dependency-behavior pins). The gate a ported service binary must pass via the E2E_SERVICE_CMD harness seam: `E2E_SERVICE_CMD=<binary> pytest -m conformance`",
]
