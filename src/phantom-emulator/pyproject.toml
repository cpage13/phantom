[project]
name = "phantom-emulator"
version = "0.1.0"
description = "Emulation server for Phantom E2E testing — mock upstream file-upload API + fake-S3 + fake-AD + configurable failure modes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Lower+upper bound: the emulator's SigV4 validator (routers/s3.py) leans on
    # private SigV4Auth internals (canonical_request reading X-Amz-Content-SHA256,
    # the lower-level methods reading context['timestamp'], the module-level
    # SIGNED_HEADERS_BLACKLIST) that have shifted across botocore releases. The
    # Phase 0 unit tier (tests/unit/test_s3_router.py) is the canary: a bump that
    # changes that call surface goes red on the bump, not silently in production.
    "botocore>=1.43.36,<1.44",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "pydantic>=2",
    "pydantic-settings>=2.14",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.28",
    "pyyaml>=6.0.3",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom_emulator"]

[dependency-groups]
dev = [
    "httpx>=0.23.3",
]

[project.scripts]
phantom-emulator = "phantom_emulator.__main__:main"
