[project]
name = "phantom-client"
version = "0.1.0"
description = "Generic Python SDK for the Phantom upload-proxy service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # See phantom/pyproject.toml for the httpx version rationale.
    "httpx>=0.23.3,<0.24",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom_client"]
