[project]
name = "phantom-service"
version = "0.1.0"
description = "Buffering upload-proxy service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.22.1",
    "azure-identity>=1.25.3",
    "botocore>=1.43,<1.44",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    # Bounded by the upstream client's `from httpx._types import ProxiesTypes`
    # (removed in 0.28); we follow the upstream's `httpx ^0.23.3` pin for
    # compatibility.
    "httpx>=0.23.3,<0.24",
    "jsonpath-ng>=1.7",
    "psutil>=7.1.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6",
    "structlog>=25.5.0",
    "uvicorn>=0.46.0",
    "zstandard>=0.25.0",
]   # add with `uv add` from this directory

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom"]

[project.scripts]
phantom = "phantom.__main__:main"
