# phantom-deploy/docker-compose.yml — reference compose for local
# dev + single-machine deployments.
#
# This is a reference, not a production fleet manifest. Production
# producer deployments use the orchestrator the fleet manager provides
# (Balena / Kubernetes / nomad / systemd-podman); this compose
# exists so an operator can spin up Phantom + a config locally
# in one command and exercise the admin surface.
#
# Usage from the repository root:
#
#   docker compose -f src/phantom-deploy/docker-compose.yml up
#
# Then visit (everything rides the one listener):
#   http://127.0.0.1:8080                     (ingress)
#   http://127.0.0.1:8080/v1/healthz          (liveness)
#   http://127.0.0.1:8080/v1/readyz           (readiness)
#   http://127.0.0.1:8080/v1/admin/status     (admin)

services:
  phantom-service:
    image: ghcr.io/${PHANTOM_ORG:-anthropic-example-org}/phantom-service:${PHANTOM_TAG:-latest}
    # Uncomment to build locally from the repository root:
    # build:
    #   context: ../../
    #   dockerfile: src/phantom-deploy/Dockerfile
    container_name: phantom-service
    # The container listener must bind 0.0.0.0 so docker's port-forward
    # reaches it (a loopback bind inside the container is unreachable from
    # the host). The HOST side maps to 127.0.0.1 only, so the port stays
    # loopback-only on the machine - the loopback safety lives on the host
    # mapping, not the in-container bind. (The mounted config's loopback
    # default is correct for a bare-metal run; in a container we override.)
    environment:
      PHANTOM_SERVER__BIND_TCP: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:8080:8080"      # one listener (intake + admin + health) — loopback-only on the host
    volumes:
      - phantom-data:/var/lib/phantom                                         # persistent data dir
      - ../../config/phantom.yaml.example:/etc/phantom/phantom.yaml:ro        # mounted config
    command: ["-c", "/etc/phantom/phantom.yaml"]
    restart: unless-stopped
    # Liveness on the single listener (GET /v1/healthz). The check runs
    # inside the container against 127.0.0.1, so it reaches the listener.
    # The runtime image is shell-less, so the check uses Python's stdlib
    # urllib (the same probe the Dockerfile HEALTHCHECK runs).
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # The service crashes visibly on unhandled worker exceptions (composition root
    # TaskGroup propagates); the orchestrator restarts. Persisted rows survive.

volumes:
  phantom-data:
    driver: local
